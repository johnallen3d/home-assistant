# Charlie Presence Tracker
# Drives input_boolean.charlie_presence from Charlie's Talker (iPad mini 5,
# Wi-Fi-only). Charlie Arrival / Departure and the shapes automations key off
# the input_boolean, not the trackers directly.
#
# Primary tracker: device_tracker.talker_wifi (Eero router presence on
# beltalowda-net, MAC e2:84:16:97:3e:f7). Because the Talker is Wi-Fi-only and
# does not join Wi-Fi away from home, the HA Companion App tracker
# (device_tracker.talker) stays stuck at "home" when Charlie leaves.
#
# Away waits 45 minutes on Wi-Fi disconnect to ride out iPad sleep on battery
# and brief router blips; unknown/unavailable never count as away (Eero has
# brief ~2 AM cloud timeouts). The companion app tracker remains as a secondary
# arrival/departure trigger if Talker ever connects to Wi-Fi elsewhere.
# The charlies_home / charlies_away scripts remain as manual overrides.

id: '1795382623931'
alias: "Charlie Presence Tracker"
description: "Set Charlie's presence from the Talker Wi-Fi and companion app trackers"
mode: queued

triggers:
  - trigger: state
    entity_id: device_tracker.talker_wifi
    to: "home"
    not_from:
      - unknown
      - unavailable
    id: arrived
  - trigger: state
    entity_id: device_tracker.talker
    to: "home"
    not_from:
      - unknown
      - unavailable
    id: arrived
  - trigger: state
    entity_id: device_tracker.talker_wifi
    to: "not_home"
    for:
      minutes: 45
    id: departed
  - trigger: state
    entity_id: device_tracker.talker
    from: "home"
    not_to:
      - unknown
      - unavailable
    for:
      minutes: 10
    id: departed

conditions: []

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: arrived
          - condition: state
            entity_id: input_boolean.charlie_presence
            state: "off"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.charlie_presence
      - conditions:
          - condition: trigger
            id: departed
          - condition: state
            entity_id: input_boolean.charlie_presence
            state: "on"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.charlie_presence
