id: "1771251368598"
alias: "Matter Server Watchdog"
description: >-
  Restarts Matter Server when the bathroom FP300 is unavailable for one minute,
  or another Matter node has a failed subscription for over 30 minutes. Saves
  pre-restart logs and sends one notification after restart.
triggers:
  - trigger: state
    entity_id: binary_sensor.bathroom_presence_sensor_occupancy
    to: unavailable
    for:
      minutes: 1
    id: bathroom
  - trigger: state
    entity_id: binary_sensor.bathroom_presence_sensor_occupancy
    to: unknown
    for:
      minutes: 1
    id: bathroom
  - trigger: numeric_state
    entity_id: sensor.matter_log_subscription_failures
    above: 0
    id: matter_log
conditions: []
actions:
  - variables:
      failure: >-
        {% if trigger.id == 'bathroom' %}
          Bathroom Presence Sensor unavailable for one minute
        {% else %}
          {{ state_attr('sensor.matter_log_subscription_failures', 'first_node')
             or 'Matter node subscription failed' }}
        {% endif %}
  - action: shell_command.capture_matter_server_logs
  - action: hassio.addon_restart
    data:
      addon: core_matter_server
  - delay:
      seconds: 30
  - action: notify.mobile_app_john_allens_iphone
    data:
      title: "Matter Server Restarted"
      message: >-
        {{ failure }}. Restarted Matter Server. Pre-restart logs saved for diagnosis.
mode: single
