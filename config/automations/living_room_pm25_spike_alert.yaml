id: '1770580850827'
alias: Living Room PM2.5 Spike Alert
description: >-
  Notify when living-room PM2.5 exceeds 50 µg/m³ for 5 minutes.
  Sustained readings avoid alerts for brief particulate spikes.
triggers:
  - trigger: numeric_state
    entity_id: sensor.alpstuga_air_quality_monitor_pm2_5
    above: 50
    for:
      minutes: 5
actions:
  - action: notify.mobile_app_john_allens_iphone
    data:
      title: "\U0001F637 Living Room PM2.5 High"
      message: >-
        PM2.5 is {{ states('sensor.alpstuga_air_quality_monitor_pm2_5')
        | round(0) }} µg/m³ — open windows to clear particulates
mode: single
