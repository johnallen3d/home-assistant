id: "e50e2344-43d6-4411-965a-afad357202ec"
alias: "Living Room Snake Plant Dry Alert"
description: >-
  Notify once when the living room snake plant is dry. The sensor briefly
  publishes an empty state before each reading, so the helper prevents
  duplicate alerts. Reset after the plant returns to normal moisture, or to
  almost dry once the alert is at least a day old (so a partial watering
  re-arms it without Dry/Almost Dry flapping re-alerting). A daily check
  notifies when the soil monitor has stopped reporting.
triggers:
  - trigger: state
    entity_id: sensor.xiao_soil_moisture_monitor_a160e4_soil_moisture_status
    to: "Dry"
    id: dry
  - trigger: state
    entity_id: sensor.xiao_soil_moisture_monitor_a160e4_soil_moisture_status
    to: "Normal Moisture"
    id: recovered
  - trigger: state
    entity_id: sensor.xiao_soil_moisture_monitor_a160e4_soil_moisture_status
    to: "Almost Dry"
    id: partially_recovered
  - trigger: time
    at: "09:00:00"
    id: stale_check
conditions: []
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: dry
          - condition: state
            entity_id: input_boolean.living_room_snake_plant_dry_alerted
            state: "off"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.living_room_snake_plant_dry_alerted
          - action: notify.mobile_app_john_allens_iphone
            data:
              title: "🪴 Living Room Snake Plant"
              message: "Soil is dry. Water when convenient."
      - conditions:
          - condition: trigger
            id: recovered
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_snake_plant_dry_alerted
      - conditions:
          - condition: trigger
            id: partially_recovered
          - condition: state
            entity_id: input_boolean.living_room_snake_plant_dry_alerted
            state: "on"
            for:
              hours: 24
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.living_room_snake_plant_dry_alerted
      - conditions:
          - condition: trigger
            id: stale_check
          - condition: template
            value_template: >-
              {% set s = states.sensor.xiao_soil_moisture_monitor_a160e4_soil_moisture_status %}
              {{ s is none or s.state in ['unavailable', 'unknown']
                 or now() - s.last_reported > timedelta(hours=24) }}
        sequence:
          - action: notify.mobile_app_john_allens_iphone
            data:
              title: "🪴 Snake Plant Monitor Offline"
              message: >-
                {% set s = states.sensor.xiao_soil_moisture_monitor_a160e4_soil_moisture_status %}
                No soil reading since
                {{ s.last_reported | as_local | as_timestamp | timestamp_custom('%b %-d, %-I:%M %p') if s else 'unknown' }}.
                Check or charge the monitor.
mode: single
