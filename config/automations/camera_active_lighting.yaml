id: '1765934015096'
alias: 'Camera Active Lighting'
description: 'Turn camera mode on while the laptop camera is in use and off when it stops (lighting handled by Camera Mode Changed)'
trigger:
  - platform: state
    entity_id: binary_sensor.m4_macbook_pro_camera_in_use
    from: 'off'
    to: 'on'
    id: camera_on
  - platform: state
    entity_id: binary_sensor.m4_macbook_pro_camera_in_use
    from: 'on'
    to: 'off'
    id: camera_off
action:
  - choose:
      - conditions:
          - condition: trigger
            id: camera_on
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: input_boolean.camera_mode
      - conditions:
          - condition: trigger
            id: camera_off
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.camera_mode
mode: queued
