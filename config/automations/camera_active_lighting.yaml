id: '1765934015096'
alias: 'Camera Active Lighting'
description: 'Turn the living room floor lamp to full brightness while the laptop camera is in use, then restore its previous state'
trigger:
  - platform: state
    entity_id: binary_sensor.m4_macbook_pro_camera_in_use
    from: 'off'
    to: 'on'
    id: camera_on
  - platform: state
    entity_id: binary_sensor.m4_macbook_pro_camera_in_use
    from: 'on'
    to: 'off'
    id: camera_off
action:
  - choose:
      - conditions:
          - condition: trigger
            id: camera_on
        sequence:
          - service: scene.create
            data:
              scene_id: before_camera_living_room_lamp
              snapshot_entities:
                - light.living_room_light
          - service: light.turn_on
            target:
              entity_id: light.living_room_light
            data:
              brightness: 255
      - conditions:
          - condition: trigger
            id: camera_off
        sequence:
          - service: scene.turn_on
            target:
              entity_id: scene.before_camera_living_room_lamp
mode: queued
