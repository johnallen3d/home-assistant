id: "1742054400000"
alias: "Low Battery Alert"
description: >-
  Send push notification when device batteries drop below 5%.
  The snake plant monitor alerts after a 5-minute debounce because
  its hourly wake cycle starts with noisy readings. Excludes rechargeable
  devices (phones, laptops, vacuum, and Ember mugs).
triggers:
  - trigger: numeric_state
    entity_id:
      - sensor.kitchen_button_battery
      - sensor.bedside_button_battery
      - sensor.kitchen_counter_switch_battery
      - sensor.nuki_smart_lock_battery
      - sensor.laundry_room_switch_battery
      - sensor.bathroom_presence_sensor_battery
      - sensor.laundry_room_sensor_battery
    below: 5
  - trigger: numeric_state
    entity_id: sensor.xiao_soil_moisture_monitor_a160e4_battery_measurement
    below: 5
    for: "00:05:00"
conditions:
  - condition: template
    value_template: >-
      {{ trigger.to_state.state not in ['unavailable', 'unknown'] }}
actions:
  - action: notify.mobile_app_john_allens_iphone
    data:
      title: "Low Battery"
      message: >-
        {{ state_attr(trigger.entity_id, 'friendly_name') }} is at
        {{ states(trigger.entity_id) | float | round(0) | int }}%
      data:
        push:
          sound:
            name: default
            critical: 0
            volume: 0.5
mode: single
