id: '1770580838432'
alias: Living Room High CO2 Alert
description: >-
  Notify when living-room CO2 indicates ventilation is needed: between
  1200 and 1800 ppm for 5 minutes, or above 1800 ppm for 2 minutes.
  These are ventilation reminders, not emergency exposure limits.
triggers:
  - trigger: numeric_state
    entity_id: sensor.alpstuga_air_quality_monitor_carbon_dioxide
    above: 1200
    below: 1800
    for:
      minutes: 5
    id: elevated
  - trigger: numeric_state
    entity_id: sensor.alpstuga_air_quality_monitor_carbon_dioxide
    above: 1800
    for:
      minutes: 2
    id: high
actions:
  - choose:
      - conditions:
          - condition: trigger
            id: high
        sequence:
          - action: notify.mobile_app_john_allens_iphone
            data:
              title: "\U0001FAC1 High CO2 in Living Room"
              message: >-
                CO2 is {{ states('sensor.alpstuga_air_quality_monitor_carbon_dioxide')
                | round(0) }} ppm — open windows now
      - conditions:
          - condition: trigger
            id: elevated
        sequence:
          - action: notify.mobile_app_john_allens_iphone
            data:
              title: "\U0001F32C\uFE0F Living Room CO2 Elevated"
              message: >-
                CO2 is {{ states('sensor.alpstuga_air_quality_monitor_carbon_dioxide')
                | round(0) }} ppm — consider opening a window
mode: single
