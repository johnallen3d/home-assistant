# Kitchen iPad (/dashboard-kitchen): always-dark, low-glare theme.
# Dark values are top-level so it stays dark even if the iPad is in light mode.
kitchen-dim:
  primary-color: "#c98a3c"
  accent-color: "#c98a3c"
  primary-background-color: "#0b0b0c"
  lovelace-background: "#0b0b0c"
  secondary-background-color: "#141416"
  card-background-color: "#141416"
  ha-card-background: "#141416"
  ha-card-border-width: "0px"
  ha-card-border-radius: "14px"
  ha-card-box-shadow: "none"
  primary-text-color: "#b9b6b0"
  secondary-text-color: "#76736e"
  disabled-text-color: "#4a4845"
  divider-color: "#222225"
  state-icon-color: "#6e6b66"
  state-active-color: "#b07a36"
  state-light-active-color: "#b07a36"
  state-input_boolean-on-color: "#b07a36"
  state-switch-on-color: "#b07a36"
  tile-color: "#b07a36"
  paper-item-icon-color: "#6e6b66"
  input-fill-color: "#1b1b1e"
  ha-dialog-surface-background: "#141416"
  mdc-theme-surface: "#141416"
  stack-card-gap: "12px"
  amber-color: "#a8762f"
  mdc-theme-primary: "#a8762f"
  ha-color-primary-40: "#8a6128"
  ha-color-primary-50: "#a8762f"
  ha-color-primary-60: "#b9894a"
  ha-color-primary-90: "#2a2118"
  ha-color-primary-95: "#1f1a14"
  ha-color-fill-primary-loud-resting: "#5a4224"
  ha-color-fill-primary-normal-resting: "#2a2118"
  ha-color-fill-primary-quiet-resting: "#1f1a14"
  ha-color-on-primary-loud: "#d8cbb8"
  ha-color-on-primary-normal: "#c9a36e"
  ha-color-on-primary-quiet: "#c9a36e"
  modes:
    dark: {}
