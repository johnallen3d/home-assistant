# Material You (M3 Expressive) -- Mobile Lab style prototype (view /mobile-lab/material).
# Hand-written M3 tonal palette from one seed: #3D6FB6 (blue), SchemeVibrant,
# generated by /tmp/mlab/material/gen_theme.py. Light values are top-level defaults
# (so the theme applies in any browser mode); `modes:` carries light and dark.
# md-sys-color-* vars are read by the per-card Bubble `styles:` on the view.
