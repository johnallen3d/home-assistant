# Entities exposed to HomeKit Bridge
#
# This uses a domain-based model with include/exclude lists.
# Unlike voice assistant (per-entity), HomeKit exposes entire domains
# and then refines with include_entities and exclude_entities.
#
# Usage:
#   mise run exposure-homekit --dry-run   - Read-only plan
#   mise run exposure-homekit             - Apply; stop/start HA only for storage changes
# Cameras below are standalone accessories, never part of the existing bridge.

# Domains to include (all entities in these domains are exposed)
# Note: lock domain removed - Nuki lock is exposed directly via Matter fabric sharing
include_domains:
  - light

# Specific entities to include (from domains NOT in include_domains)
include_entities:
  # Scenes (one-shot actions without mode helpers)
  - scene.lights_out
  - scene.shaving
  # Scripts (one-shot actions without mode helpers)
  # Use Departing Home for departure automations; Lights Out is unguarded/manual.
  - script.departing_home
  - script.arriving_home
  - script.good_morning
  - script.kitchen_chill
  # Switches (only useful ones, not camera/vacuum controls)
  - switch.kitchen_counter_switch
  - switch.laundry_room_switch
  - switch.sound_machine_outlet
  # Helpers (booleans show as switches with ON/OFF state)
  - input_boolean.charlie_eating_mode
  - input_boolean.charlie_presence
  - input_boolean.cooking_mode
  - input_boolean.dad_eating_mode
  - input_boolean.hobby_mode
  - input_boolean.meditation_mode
  - input_boolean.working_mode
  - input_boolean.door_lock

# Entities to exclude (from included domains)
exclude_entities:
  # ESPHome diagnostic LEDs
  - light.atom_echo_led
  # Plug indicator lights (not actual lights)
  - light.bedroom_plug_dnd
  # Individual bulbs (use light.living_room_overhead_light group instead)
  - light.living_room_overhead_thread
  - light.living_room_overhead_wifi

# Integration options are applied via the HA options-flow API. Only secret NAMES
# belong here. Values stay in Doppler and HA storage, never in Git or task output.
frigate_rtsp:
  integration_url: http://192.168.5.20:8971
  host: 192.168.5.20
  doppler_project: pi-cielo
  doppler_config: prod
  username_secret: FRIGATE_RTSP_USER
  password_secret: FRIGATE_RTSP_PASSWORD

# One stable HomeKit accessory per Frigate camera. Do not use ONVIF/direct-Wyze
# entities. Person occupancy drives HomeKit motion notifications with snapshots;
# this is not HomeKit Secure Video. Audio is deliberately disabled on both.
camera_accessories:
  - name: Charlie Cam
    port: 21065
    entity_id: camera.charlie_cam_2
    linked_motion_sensor: binary_sensor.charlie_cam_person_occupancy
    video_codec: copy
    support_audio: false
  - name: Entry Nest
    port: 21066
    entity_id: camera.entry_nest
    linked_motion_sensor: binary_sensor.entry_nest_person_occupancy
    video_codec: copy
    support_audio: false
