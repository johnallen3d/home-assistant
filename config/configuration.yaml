    name: Kitchen Lights
    entities:
      - light.island_bulb
      - light.sink_bulb
      - light.hue_lightstrip_plus_1
  - platform: group
    name: Island Lights
    entities:
      - light.island_bulb
      - light.sink_bulb
  - platform: group
    name: Dad's Overhead Lights
    entities:
      - light.bedroom_overhead_left
      - light.bedroom_overhead_right
  - platform: group
    name: Bedroom Lights
    entities:
      - light.bedroom_lamp
      - light.bedroom_overhead_left
      - light.bedroom_overhead_right
  - platform: group
    name: Bathroom Lights
    entities:
      - light.bathroom
      - light.bathroom_lamp
  - platform: group
    name: Living Room Overhead Light
    entities:
      - light.living_room_overhead_thread
      - light.living_room_overhead_wifi
  - platform: group
    name: Living Room Lights
    entities:
      - light.living_room_light
      - light.living_room_overhead_thread
      - light.living_room_overhead_wifi

